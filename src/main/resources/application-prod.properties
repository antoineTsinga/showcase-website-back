server.port=${PORT}
spring.datasource.url=jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=${PGSSLMODE}&channelBinding=${PGCHANNELBINDING}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.name = spring-showcase

spring.jpa.hibernate.ddl-auto=update
springdoc.swagger-ui.path=/api-docs
cors.allowed-origins=https://onix-dev.vercel.app,https://antoine-tsinga.vercel.app,https://onix.up.railway.app,https://showcase-website-back.onrender.com
allowed-hosts=vercel.app,railway.app
cookie.secure=true
cookie.same-site=none
